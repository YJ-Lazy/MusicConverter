plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.kapt'
    id 'com.chaquo.python'
}

android {
    namespace "com.musicconverter.miui"
    compileSdk 35

    signingConfigs {
        release {
            def storeFilePath = System.getenv("RELEASE_STORE_FILE")
            if (storeFilePath) {
                storeFile file(storeFilePath)
                storePassword System.getenv("RELEASE_STORE_PASSWORD")
                keyAlias System.getenv("RELEASE_KEY_ALIAS")
                keyPassword System.getenv("RELEASE_KEY_PASSWORD")
            }
        }
    }

    defaultConfig {
        applicationId "com.musicconverter.miui"
        minSdk 29
        targetSdk 35
        versionCode 31
        versionName "1.10.0-ace-style-ui"

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
    }

    buildTypes {
        debug { minifyEnabled false }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }
    packagingOptions { jniLibs { useLegacyPackaging = true } }
}

def generatedCurrentKotlinDir = file("$buildDir/generated/currentKotlin")

android {
    sourceSets {
        // GitHub keeps the latest large/changed Kotlin sources as gzip+Base64 parts.
        // Build from the generated tree only, so stale direct copies cannot create duplicate classes.
        main.java.setSrcDirs([generatedCurrentKotlinDir])
    }
}

tasks.register("restoreCurrentKotlinSources") {
    def sourceSpecs = [
        ["com/musicconverter/miui/MainActivity.kt", (0..5).collect { file("compressed-src/MainActivity.kt.gz.b64.part${it}") }],
        ["com/musicconverter/miui/update/RemoteUpdateManager.kt", (0..2).collect { file("compressed-src/RemoteUpdateManager.kt.gz.b64.part${it}") }],
        ["com/musicconverter/miui/core/AudioFileManager.kt", [file("compressed-src/AudioFileManager.kt.gz.b64.part0")]],
        ["com/musicconverter/miui/core/DeleteManager.kt", [file("compressed-src/DeleteManager.kt.gz.b64.part0")]],
        ["com/musicconverter/miui/core/FfmpegEngine.kt", [file("compressed-src/FfmpegEngine.kt.gz.b64.part0")]],
        ["com/musicconverter/miui/core/IgnoredFormatPreferences.kt", [file("compressed-src/IgnoredFormatPreferences.kt.gz.b64.part0")]],
        ["com/musicconverter/miui/editor/AudioEditorActivity.kt", (0..1).collect { file("compressed-src/AudioEditorActivity.kt.gz.b64.part${it}") }],
        ["com/musicconverter/miui/editor/WaveformExtractor.kt", [file("compressed-src/WaveformExtractor.kt.gz.b64.part0")]],
        ["com/musicconverter/miui/editor/WaveformView.kt", [file("compressed-src/WaveformView.kt.gz.b64.part0")]],
        ["com/musicconverter/miui/scanner/FullStorageAudioScanner.kt", [file("compressed-src/FullStorageAudioScanner.kt.gz.b64.part0")]],
        ["com/musicconverter/miui/scanner/StorageAudioScanner.kt", [file("compressed-src/StorageAudioScanner.kt.gz.b64.part0")]],
        ["com/musicconverter/miui/service/BatchConversionService.kt", (0..2).collect { file("compressed-src/BatchConversionService.kt.gz.b64.part${it}") }],
        ["com/musicconverter/miui/ui/ThemePreferences.kt", [file("compressed-src/ThemePreferences.kt.gz.b64.part0")]],
        ["com/musicconverter/miui/ui/UiKit.kt", [file("compressed-src/UiKit.kt.gz.b64.part0")]]
    ]

    inputs.files(sourceSpecs.collectMany { it[1] })
    inputs.dir(file("src/main/java"))
    outputs.dir generatedCurrentKotlinDir

    doLast {
        delete generatedCurrentKotlinDir
        generatedCurrentKotlinDir.mkdirs()

        copy {
            from file("src/main/java")
            into generatedCurrentKotlinDir
        }

        sourceSpecs.each { spec ->
            def relativePath = spec[0]
            def parts = spec[1]
            def encoded = parts.collect { it.getText("UTF-8").trim() }.join("")
            def compressed = java.util.Base64.decoder.decode(encoded)
            def target = new File(generatedCurrentKotlinDir, relativePath)
            target.parentFile.mkdirs()
            new java.util.zip.GZIPInputStream(new java.io.ByteArrayInputStream(compressed)).withCloseable { input ->
                target.withOutputStream { output -> output << input }
            }
        }
    }
}

def ffmpegBinaryPartsDir = rootProject.file("ffmpeg-kit/binary-parts")

tasks.register("restoreFfmpegBinaries") {
    inputs.dir ffmpegBinaryPartsDir
    outputs.upToDateWhen { false }

    doLast {
        if (!ffmpegBinaryPartsDir.exists()) {
            return
        }

        def partFiles = fileTree(ffmpegBinaryPartsDir).matching { include "**/*.part*" }.files
        partFiles.groupBy { part ->
            ffmpegBinaryPartsDir.toPath().relativize(part.toPath()).toString().replaceFirst(/\.part\d+$/, "")
        }.each { relativePath, parts ->
            def target = rootProject.file("ffmpeg-kit/${relativePath}")
            target.parentFile.mkdirs()
            target.withOutputStream { output ->
                parts.sort { it.name }.each { part ->
                    part.withInputStream { input -> output << input }
                }
            }
        }
    }
}

tasks.named("preBuild").configure {
    dependsOn tasks.named("restoreCurrentKotlinSources")
    dependsOn tasks.named("restoreFfmpegBinaries")
}

chaquopy {
    defaultConfig {
        version "3.11"
        if (System.getProperty("os.name").toLowerCase().contains("windows")) {
            buildPython("py", "-3.11")
        } else {
            buildPython("python3")
        }
        pip {
            install "pycryptodome==3.21.0"
            install "mutagen==1.47.0"
        }
    }
}

dependencies {
    implementation project(':ffmpeg-kit')
    implementation "androidx.room:room-runtime:2.6.1"
    kapt "androidx.room:room-compiler:2.6.1"
}
