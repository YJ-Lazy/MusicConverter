plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.kapt'
    id 'com.chaquo.python'
}


android {

    namespace "com.musicconverter.miui"

    compileSdk 35


    defaultConfig {

        applicationId "com.musicconverter.miui"

        minSdk 29
        targetSdk 35

        versionCode 19
        versionName "1.8.5.1-buildconfig-fix"


        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
    }


    buildTypes {

        debug {
            minifyEnabled false
        }


        release {
            minifyEnabled false

            proguardFiles getDefaultProguardFile(
                    'proguard-android-optimize.txt'
            ), 'proguard-rules.pro'
        }
    }


    compileOptions {

        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }


    kotlinOptions {
        jvmTarget = "17"
    }


    packagingOptions {

        jniLibs {
            useLegacyPackaging = true
        }
    }
}


def generatedCurrentKotlinDir = file("$buildDir/generated/currentKotlin")

android {
    sourceSets {
        main.java.srcDir generatedCurrentKotlinDir
    }
}

tasks.register("restoreCurrentKotlinSources") {
    def sources = [
        [
            (0..4).collect { file("compressed-src/MainActivity.kt.gz.b64.part${it}") },
            new File(generatedCurrentKotlinDir, "com/musicconverter/miui/MainActivity.kt")
        ],
        [
            (0..1).collect { file("compressed-src/RemoteUpdateManager.kt.gz.b64.part${it}") },
            new File(generatedCurrentKotlinDir, "com/musicconverter/miui/update/RemoteUpdateManager.kt")
        ]
    ]

    inputs.files(sources.collectMany { it[0] })
    outputs.dir generatedCurrentKotlinDir

    doLast {
        sources.each { entry ->
            def parts = entry[0]
            def target = entry[1]
            def encoded = parts.collect { it.getText("UTF-8").trim() }.join("")
            def compressed = java.util.Base64.decoder.decode(encoded)
            target.parentFile.mkdirs()
            new java.util.zip.GZIPInputStream(new java.io.ByteArrayInputStream(compressed)).withCloseable { input ->
                target.withOutputStream { output -> output << input }
            }
        }
    }
}

tasks.named("preBuild").configure {
    dependsOn tasks.named("restoreCurrentKotlinSources")
}


chaquopy {
    defaultConfig {
        version "3.11"

        buildPython("py", "-3.11")

        pip {
            install "pycryptodome==3.21.0"
            install "mutagen==1.47.0"
        }
    }
}


dependencies {

    implementation project(':ffmpeg-kit')


    implementation "androidx.room:room-runtime:2.6.1"

    kapt "androidx.room:room-compiler:2.6.1"
}