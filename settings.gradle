pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

    repositories {
        google()
        mavenCentral()
        maven {
            url = uri("https://api.xposed.info/")
            content { includeGroup("de.robv.android.xposed") }
        }
    }
}

rootProject.name = "MusicConverter_MIUI_Pro"

include ':app'
include ':ffmpeg-kit'

project(':ffmpeg-kit').projectDir =
        file('ffmpeg-kit/android/ffmpeg-kit-android-lib')