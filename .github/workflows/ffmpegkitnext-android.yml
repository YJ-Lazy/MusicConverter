name: Prepare persistent FFmpegKitNext dependency

on:
  workflow_call:
    inputs:
      allow_publish:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      series:
        description: 'Optional future major.minor series, e.g. 2.8 (empty = current app series)'
        type: string
        required: false

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    concurrency:
      group: ffmpegkitnext-persistent-producer
      cancel-in-progress: false
    steps:
      - name: Checkout public project
        uses: actions/checkout@v4

      - name: Resolve dependency series
        id: series
        env:
          REQUESTED: ${{ inputs.series }}
        shell: bash
        run: |
          set -euo pipefail
          series="$(bash tools/ffmpegkitnext_dependency.sh series)"
          if [[ -n "$REQUESTED" ]]; then series="$REQUESTED"; fi
          [[ "$series" =~ ^[0-9]+\.[0-9]+$ ]]
          echo "series=$series" >> "$GITHUB_OUTPUT"

      - name: Fetch persistent public Maven bundle
        id: dependency
        env:
          SERIES: ${{ steps.series.outputs.series }}
          CAN_PUBLISH: ${{ inputs.allow_publish || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
        shell: bash
        run: |
          set -euo pipefail
          if bash tools/ffmpegkitnext_dependency.sh fetch "$SERIES"; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            result=$?
            if [[ "$result" != 44 || "$CAN_PUBLISH" != true ]]; then
              echo "::error::Cannot obtain dependency for $SERIES; prepare it from the public repository first."
              exit 1
            fi
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout official FFmpegKitNext
        if: steps.dependency.outputs.ready == 'false'
        uses: actions/checkout@v4
        with:
          repository: arthenica/ffmpeg-kit-next
          ref: v9.0.2
          path: ffmpeg-kit-next

      - name: Install Nix
        if: steps.dependency.outputs.ready == 'false'
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Compile FFmpegKitNext for new series
        if: steps.dependency.outputs.ready == 'false'
        working-directory: ffmpeg-kit-next
        shell: bash
        run: |
          set -euo pipefail
          if ./nix-android.sh -p android-r27d --arch=arm-v7a,arm64-v8a --api-level=29 2>&1 | tee ../ffmpegkit-build-console.log; then
            echo "FFmpegKitNext build complete"
          else
            find . -name build.log -type f -print -exec tail -n 250 {} \;
            df -h
            exit 1
          fi

      - name: Stage and verify local Maven repository
        if: steps.dependency.outputs.ready == 'false'
        shell: bash
        run: |
          set -euo pipefail
          source_repo="$(find ffmpeg-kit-next/prebuilt -type d -name 'bundle-android-aar-29-maven' -print -quit)"
          test -n "$source_repo"
          mkdir -p third_party/ffmpegkitnext-maven
          cp -a "$source_repo"/. third_party/ffmpegkitnext-maven/
          bash tools/ffmpegkitnext_dependency.sh verify

      - name: Publish immutable series bundle to public dependency branch
        if: steps.dependency.outputs.ready == 'false'
        env:
          SERIES: ${{ steps.series.outputs.series }}
        shell: bash
        run: |
          set -euo pipefail
          branch=ffmpegkitnext-prebuilt
          path="ffmpegkitnext/9.0.2/r27d-api29-arm/$SERIES"
          work="$(mktemp -d)"
          if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null; then
            git fetch origin "refs/heads/$branch"
            git worktree add --detach "$work" FETCH_HEAD
          else
            status=$?
            test "$status" = 2
            git worktree add --detach "$work" HEAD
            git -C "$work" switch --orphan "$branch"
          fi
          mkdir -p "$work/$path"
          test ! -e "$work/$path/maven.tar.gz"
          tar -czf "$work/$path/maven.tar.gz" -C third_party/ffmpegkitnext-maven .
          test "$(stat -c %s "$work/$path/maven.tar.gz")" -lt 95000000
          (cd "$work/$path"; sha256sum maven.tar.gz > maven.tar.gz.sha256)
          printf 'FFmpegKitNext v9.0.2, NDK r27d, API 29, ARMv7 + ARM64\nUpstream: https://github.com/arthenica/ffmpeg-kit-next/tree/v9.0.2\nSource revision: %s\nApp series: %s\n' "$(git -C ffmpeg-kit-next rev-parse HEAD)" "$SERIES" > "$work/$path/BUILD_INFO.txt"
          printf 'Prebuilt FFmpegKitNext dependencies only; not application releases. See upstream source and license at https://github.com/arthenica/ffmpeg-kit-next/tree/v9.0.2.\n' > "$work/README.md"
          # Keep the public upstream and bundled component license notices with each binary bundle.
          mkdir -p "$work/$path/licenses"
          find ffmpeg-kit-next -maxdepth 1 -type f \( -iname 'license*' -o -iname 'copying*' -o -iname 'notice*' \) -exec cp {} "$work/$path/licenses/" \;
          if test -d ffmpeg-kit-next/src/ffmpeg; then
            find ffmpeg-kit-next/src/ffmpeg -maxdepth 1 -type f \( -iname 'license*' -o -iname 'copying*' \) -exec cp {} "$work/$path/licenses/" \;
          fi
          git -C "$work" config user.name "github-actions[bot]"
          git -C "$work" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$work" add README.md "$path"
          git -C "$work" commit -m "Store FFmpegKitNext v9.0.2 for app series $SERIES"
          git -C "$work" push origin "HEAD:refs/heads/$branch"

      - name: Upload verified Maven dependency for APK jobs
        uses: actions/upload-artifact@v4
        with:
          name: ffmpegkitnext-maven
          path: third_party/ffmpegkitnext-maven/
          if-no-files-found: error
          retention-days: 1

      - name: Upload FFmpegKitNext failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ffmpegkitnext-failure
          path: |
            ffmpegkit-build-console.log
            ffmpeg-kit-next/**/build.log
            ffmpeg-kit-next/**/build/reports/**
          if-no-files-found: warn
          retention-days: 7
