name: Build FFmpegKitNext Android and verify app

on:
  workflow_dispatch:
  push:
    branches:
      - test/audio-ffmpeg-python-size
    paths:
      - '.github/workflows/ffmpegkitnext-android.yml'
      - 'app/**'
      - 'settings.gradle'
      - 'build.gradle'
      - 'gradle/**'

permissions:
  contents: read

concurrency:
  group: ffmpegkitnext-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout MusicConverter test branch
        uses: actions/checkout@v4

      - name: Checkout official FFmpegKitNext
        uses: actions/checkout@v4
        with:
          repository: arthenica/ffmpeg-kit-next
          ref: v9.0.2
          path: ffmpeg-kit-next

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Build FFmpegKitNext for Android (ARM only)
        working-directory: ffmpeg-kit-next
        shell: bash
        run: |
          set -euo pipefail
          ./nix-android.sh -p android-r27d --arch=arm-v7a,arm64-v8a --api-level=29

      - name: Stage local Maven repository
        shell: bash
        run: |
          set -euo pipefail
          source_repo="$(find ffmpeg-kit-next/prebuilt -type d -name 'bundle-android-aar-29-maven' -print -quit)"
          test -n "$source_repo"
          mkdir -p third_party/ffmpegkitnext-maven
          cp -a "$source_repo"/. third_party/ffmpegkitnext-maven/
          find third_party/ffmpegkitnext-maven -type f -maxdepth 8 -print

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Assemble MusicConverter debug APK against FFmpegKitNext
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Upload FFmpegKitNext AAR and debug APK
        uses: actions/upload-artifact@v4
        with:
          name: musicconverter-ffmpegkitnext-arm-test
          path: |
            third_party/ffmpegkitnext-maven/**/*.aar
            app/build/outputs/apk/debug/*.apk
            ffmpeg-kit-next/build.log
          if-no-files-found: error
          retention-days: 14
