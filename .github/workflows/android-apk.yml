name: Android APK Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Build a signed APK and create/update a GitHub Release"
        required: false
        default: false
        type: boolean
      release_tag:
        description: "Optional tag, e.g. v2.1"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  JAVA_VERSION: "17"
  PYTHON_VERSION: "3.11"

jobs:
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify direct-source baseline
        shell: bash
        run: |
          test -f app/src/main/java/com/musicconverter/miui/MainActivity.kt
          test -f app/src/main/java/com/musicconverter/miui/editor/AudioEditorActivity.kt
          test -f app/src/main/java/com/musicconverter/miui/core/FfmpegEngine.kt
          test -s app/src/main/res/drawable/ic_launcher_foreground.png
          test -s app/src/main/res/mipmap-mdpi/ic_launcher.png
          test -s app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -s app/src/main/python/assets/kugou_key.xz
          test -s ffmpeg-kit/android/libs/arm64-v8a/libavcodec.so
          test -s ffmpeg-kit/android/libs/armeabi-v7a/libavcodec.so
          ! test -d app/compressed-src
          ! test -d app/split-src

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Stage Debug APK
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/MusicConverter-v2.1-debug.apk
          sha256sum dist/MusicConverter-v2.1-debug.apk > dist/MusicConverter-v2.1-debug.apk.sha256

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MusicConverter-v2.1-debug-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish Stable Release
    needs: build-debug
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_release)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve release version and tag
        id: version
        shell: bash
        env:
          MANUAL_TAG: ${{ inputs.release_tag }}
        run: |
          VERSION=$(sed -n 's/^[[:space:]]*versionName[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle | head -n 1)
          test -n "$VERSION" || { echo "Unable to read versionName"; exit 1; }
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
          elif [[ -n "${MANUAL_TAG:-}" ]]; then
            TAG="$MANUAL_TAG"
          else
            TAG="v$VERSION"
          fi
          [[ "${TAG#v}" == "$VERSION" ]] || { echo "Tag $TAG does not match versionName $VERSION"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Check signing Secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::Missing KEYSTORE_BASE64"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "::error::Missing KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "::error::Missing KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "::error::Missing KEY_PASSWORD"; exit 1; }

      - name: Restore and validate signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks"
          keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

      - name: Build signed Release APK
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Stage Release APK
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/MusicConverter-${{ steps.version.outputs.tag }}.apk"
          sha256sum "dist/MusicConverter-${{ steps.version.outputs.tag }}.apk" > "dist/MusicConverter-${{ steps.version.outputs.tag }}.apk.sha256"

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "MusicConverter $VERSION" --generate-notes
          fi
          gh release upload "$TAG" dist/* --clobber

      - name: Upload signed Release artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicConverter-${{ steps.version.outputs.tag }}
          path: dist/*
          if-no-files-found: error
          retention-days: 90
